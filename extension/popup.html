<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>TrueVerse Verification</title>
  <style>
    :root {
      --bg: #0f172a;
      --bg-panel: rgba(30, 41, 59, 0.8);
      --bg-input: rgba(30, 41, 59, 0.5);
      --border: #334155;
      --text-main: #ffffff;
      --text-muted: #94a3b8;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 400px; min-height: 300px; background-color: var(--bg); color: var(--text-main); font-family: 'Inter', sans-serif; padding: 16px; display: flex; flex-direction: column; gap: 16px; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    
    .header { display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
    .logo-circle { width: 24px; height: 24px; border-radius: 50%; background: linear-gradient(to right, #3b82f6, #4f46e5); display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 12px; }
    .title { font-size: 18px; font-weight: bold; background: linear-gradient(to right, #60a5fa, #818cf8); -webkit-background-clip: text; color: transparent; }
    
    .input-group { display: flex; flex-direction: column; gap: 8px; }
    label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }
    textarea { width: 100%; background: var(--bg-input); border: 1px solid var(--border); border-radius: 8px; padding: 12px; font-size: 14px; color: white; outline: none; resize: none; font-family: inherit; }
    textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2); }
    
    button { width: 100%; background: linear-gradient(to right, #6366f1, #2563eb); color: white; border: none; padding: 10px 16px; border-radius: 8px; font-weight: 500; font-size: 14px; cursor: pointer; transition: opacity 0.2s; box-shadow: 0 4px 14px rgba(99, 102, 241, 0.25); }
    button:hover { opacity: 0.9; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    
    #loading { display: none; flex-direction: column; align-items: center; padding: 24px 0; gap: 8px; }
    .spinner { width: 24px; height: 24px; border: 2px solid var(--primary); border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    #results { display: none; flex-direction: column; gap: 16px; background: var(--bg-panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-top: 8px; }
    .result-header { display: flex; justify-content: space-between; align-items: center; }
    .verdict-col { display: flex; flex-direction: column; }
    #verdictTitle { font-size: 18px; font-weight: bold; }
    
    .score-ring { position: relative; width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; }
    .score-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .ring-bg { stroke: var(--border); stroke-width: 3; fill: none; }
    .ring-fill { stroke-width: 3; fill: none; stroke-dasharray: 0, 100; transition: stroke-dasharray 1s ease-out; stroke: currentColor; }
    #scoreText { position: absolute; font-size: 14px; font-weight: bold; }
    
    #verdictDesc { font-size: 14px; color: #cbd5e1; line-height: 1.4; }
    #signalsContainer { display: none; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
    .signal-badge { padding: 4px 8px; background: #334155; color: #cbd5e1; font-size: 11px; border-radius: 999px; }
    
  </style>
</head>
<body>
  <div class="header">
    <div class="logo-circle">TV</div>
    <div class="title">TrueVerse</div>
  </div>
  
  <div class="input-group">
    <label>Highlighted Text</label>
    <textarea id="textInput" rows="4" placeholder="Highlight text on any page and it will appear here..."></textarea>
    <button id="verifyBtn">Analyze Credibility</button>
  </div>

  <div id="loading">
    <div class="spinner"></div>
    <span style="font-size: 14px; color: var(--text-muted);">Analyzing claims...</span>
  </div>

  <div id="results">
    <div class="result-header">
      <div class="verdict-col">
        <span style="font-size: 12px; color: var(--text-muted); font-weight: 500; text-transform: uppercase;">Verdict</span>
        <span id="verdictTitle"></span>
      </div>
      <div class="score-ring">
        <svg viewBox="0 0 36 36">
          <path class="ring-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
          <path id="scoreCircle" class="ring-fill" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
        </svg>
        <span id="scoreText"></span>
      </div>
    </div>
    <p id="verdictDesc"></p>
    <div id="signalsContainer"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
